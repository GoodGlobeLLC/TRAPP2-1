name: Mid-Day Refresh (Macro + Regime)

# Runs mid-day every weekday. Target ~11 AM ET; with GitHub Actions queue lag
# the run lands closer to midday ET.
#
# Skips fetch_history.py (that's nightly only). Re-runs macro + signal stack.
#
# FIXED (three bugs that made this fail):
#  1. The FRED macro step passed FRED_API_KEY, but fetch_macro.py reads
#     FED_API_KEY and sys.exit(1)s when the key is empty — so the macro fetch
#     died and took the workflow with it. Now passes BOTH key names.
#  2. fetch_worldbank.py had no continue-on-error, so a transient World Bank
#     API outage failed the whole run. It's now best-effort.
#  3. Installing the full requirements.txt pulled etf-scraper (a brittle
#     third-party lib) even though midday never fetches ETF holdings — an
#     etf-scraper install break would fail midday for no reason. Midday now
#     installs only what its steps actually use.

on:
  schedule:
    - cron: '30 15 * * 1-5'
  workflow_dispatch:

concurrency:
  group: trapp2-1-regime
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install requirements (only what midday uses — no etf-scraper)
        run: pip install requests pandas fredapi "yfinance>=0.2.50,<0.3"

      - name: Fetch FRED macro series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FED_API_KEY: ${{ secrets.FED_API_KEY }}
        run: python pipeline/fetch_macro.py

      - name: Fetch World Bank country data (best-effort)
        run: python pipeline/fetch_worldbank.py
        continue-on-error: true

      - name: Compute signals
        run: python pipeline/compute_signals.py

      - name: Classify regime + append snapshot
        run: python pipeline/classify_regime.py

      - name: Compute Markov transitions
        run: python pipeline/compute_transitions.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          echo "=== files staged ==="
          git diff --staged --name-only
          if git diff --staged --quiet; then
            echo "No regime changes to commit"
          else
            git commit -m "Mid-day regime refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3; do
              if git push; then
                echo "Push succeeded on attempt $i"
                break
              fi
              echo "Push attempt $i failed, rebasing and retrying"
              git pull --rebase --autostash origin main || git pull --rebase --autostash origin master
              sleep 4
            done
          fi
