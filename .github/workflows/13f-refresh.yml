name: 13F Quarterly Refresh

# 13F filings post up to 45 days after quarter-end. Running on the 5th of
# Feb / May / Aug / Nov catches each quarter's filings shortly after the
# deadline. Also runnable manually.
on:
  schedule:
    - cron: "0 9 5 2,5,8,11 *"   # 09:00 UTC on the 5th of Feb/May/Aug/Nov
  workflow_dispatch: {}

concurrency:
  group: 13f-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch 13F holdings
        run: python pipeline/fetch_13f.py

      - name: Fetch company SEC filings (10-K/10-Q/8-K)
        run: python pipeline/fetch_sec_filings.py
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/13f/ data/sec_filings.json
          if git diff --staged --quiet; then
            echo "No 13F/filings changes."
          else
            git commit -m "13F + SEC filings refresh $(date -u +%Y-%m-%d)"
            git push
          fi
