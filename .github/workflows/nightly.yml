#  >>> DESTINATION: GoodGlobeLLC/TRAPP2-1  (.github/workflows/nightly.yml — REPLACE)
name: Nightly Full Refresh

# TRAPP2-1 is the FX / global / macro repo. It is the CANONICAL home for:
#   • FX rates + crypto prices
#   • FRED macro series (GDP, CPI, the full DGS* Treasury yield-curve tenors)
#   • global-trade GDP (IMF + World Bank)
#   • the signal stack → regime classification → Markov transitions
#   • ETF holdings
# The app reads macro + regime from THIS repo, so the regime snapshot
# (regime_current.json) published here is the one the badge/bot/dashboard use.
# Equities live in TRAPP2 / TRAPP2-2 (their own nightlies) — not here.
#
# Ordering matters: macro + FX + global-trade must run BEFORE compute_signals.py
# (it reads data/macro/ and the cross-asset inputs), which must run before
# classify_regime.py, which must run before compute_transitions.py.
#
# Resilience built in:
#  • Core deps install first (guaranteed). etf-scraper installs separately and
#    non-fatally — if it breaks, only the ETF-holdings step is skipped.
#  • fetch_macro.py reads FED_API_KEY (and exits non-zero on an empty key), so we
#    pass BOTH FRED_API_KEY and FED_API_KEY to cover either secret name.
#  • Data-producing steps that can have flaky upstreams (global trade, world
#    bank, FX, crypto, ETF holdings) are guarded with `|| echo` so one flaky
#    source can't kill the whole nightly — but the macro/signal/regime CORE
#    steps are NOT guarded, so a real regime failure is visible.
#
# 00:30 UTC = 8:30 PM ET (EDT), after the US close.

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

concurrency:
  group: trapp2-1-data-push
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install core requirements (must succeed)
        run: pip install requests pandas fredapi "yfinance>=0.2.50,<0.3"

      - name: Install etf-scraper (optional — non-fatal if it breaks)
        run: pip install "etf-scraper>=0.1.1" || echo "etf-scraper unavailable; ETF holdings step will be skipped"

      # ---- Asset prices (ETFs/foreign equities, FX, crypto) ----
      - name: Fetch quotes + fundamentals
        run: python pipeline/fetch_data.py

      - name: Fetch 5-year price history
        run: python pipeline/fetch_history.py

      - name: Fetch FX rates
        run: python pipeline/fetch_fx.py || echo "FX step had errors but continuing"

      - name: Fetch crypto prices
        run: python pipeline/fetch_crypto.py || echo "crypto step had errors but continuing"

      # ---- Macro / FRED (incl. the full yield-curve tenors) ----
      - name: Fetch FRED macro series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FED_API_KEY: ${{ secrets.FED_API_KEY }}
        run: python pipeline/fetch_macro.py

      - name: Fetch fresh global-trade GDP (IMF + World Bank)
        run: python pipeline/fetch_global_trade.py || echo "global-trade step had errors but continuing"

      - name: Fetch World Bank series
        run: python pipeline/fetch_worldbank.py || echo "world-bank step had errors but continuing"

      # ---- Signal stack → regime → transitions (CORE — not guarded) ----
      - name: Compute signals
        run: python pipeline/compute_signals.py

      - name: Classify regime + append snapshot
        run: python pipeline/classify_regime.py

      - name: Compute Markov transitions
        run: python pipeline/compute_transitions.py

      - name: Fetch ETF holdings (best-effort — skipped if etf-scraper missing)
        run: python pipeline/fetch_etf_holdings.py || echo "ETF holdings step had errors but continuing"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          echo "=== files staged ==="
          git diff --staged --name-only
          if git diff --staged --quiet; then
            echo "No nightly changes to commit"
            exit 0
          fi
          git commit -m "Nightly FX/macro/regime refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Generated JSON can't be hand-merged; on a race with a parallel run,
          # OURS wins. Retry a few times instead of a single force-with-lease
          # (which silently drops a parallel commit). This mirrors the hardened
          # push used in the equity repos.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push attempt $i failed — merging remote with OURS winning conflicts"
            git fetch origin main
            git merge -X ours origin/main 2>/dev/null || true
            if [ -f .git/MERGE_HEAD ]; then
              git checkout --ours -- data/ 2>/dev/null || true
              git add -A data/ 2>/dev/null || true
              git commit --no-edit 2>/dev/null || true
            fi
            sleep 4
          done
