name: Nightly Full Refresh

# Runs after US close. Fast pipeline:
# quotes → 5-year history → FRED macro → global trade → signals → regime →
# Markov → ETF holdings → commit
#
# Slower steps live in separate workflows (company-facts, leadership-history).
#
# FIXED (two failure modes):
#  1. The FRED macro step passed FRED_API_KEY, but fetch_macro.py reads
#     FED_API_KEY and sys.exit(1)s on an empty key — so macro failed and, since
#     the step had no guard, the whole nightly failed. Now passes BOTH names.
#  2. requirements.txt pins etf-scraper, a brittle third-party lib. When its
#     install breaks (transitive dep conflict, yanked version), `pip install -r
#     requirements.txt` failed at the INSTALL step, before any data was fetched
#     — killing the nightly entirely. We now install the core deps first
#     (guaranteed), then attempt etf-scraper separately and non-fatally; if it
#     can't install, the ETF-holdings step is simply skipped and everything else
#     still runs.

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

concurrency:
  group: trapp2-1-nightly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install core requirements (must succeed)
        run: pip install requests pandas fredapi "yfinance>=0.2.50,<0.3"

      - name: Install etf-scraper (optional — non-fatal if it breaks)
        run: pip install "etf-scraper>=0.1.1" || echo "etf-scraper unavailable; ETF holdings step will be skipped"

      - name: Fetch quotes + fundamentals
        run: python pipeline/fetch_data.py

      - name: Fetch 5-year price history
        run: python pipeline/fetch_history.py

      - name: Fetch FRED macro series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FED_API_KEY: ${{ secrets.FED_API_KEY }}
        run: python pipeline/fetch_macro.py

      - name: Fetch fresh global-trade GDP (IMF + World Bank)
        run: python pipeline/fetch_global_trade.py || echo "global-trade step had errors but continuing"

      - name: Compute signals
        run: python pipeline/compute_signals.py

      - name: Classify regime + append snapshot
        run: python pipeline/classify_regime.py

      - name: Compute Markov transitions
        run: python pipeline/compute_transitions.py

      - name: Fetch ETF holdings (best-effort — skipped if etf-scraper missing)
        run: python pipeline/fetch_etf_holdings.py || echo "ETF holdings step had errors but continuing"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          echo "=== files staged ==="
          git diff --staged --name-only
          if git diff --staged --quiet; then
            echo "No nightly changes to commit"
            exit 0
          fi
          git commit -m "Nightly refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git fetch origin main
          git push --force-with-lease origin HEAD:main
