# ============================================================
#  >>> DESTINATION: TRAPP2-1 repo  →  .github/workflows/macro-trade-refresh.yml  <<<
#  GoodGlobeLLC/TRAPP2-1/.github/workflows/macro-trade-refresh.yml
#
#  Replace the existing macro-trade-refresh.yml. Only change: the push step now
#  integrates the remote before pushing (ours wins on data/ conflicts),
#  fixing the 'fetch first' rejection when it races the nightly.
# ============================================================
name: Macro Trade + World Bank Refresh

# US trade balance (FRED) prints monthly with a ~45-day lag; World Bank GDP is
# annual but cheap to re-pull. Running on the 3rd of each month catches the
# monthly trade print and keeps the World Bank file current.
on:
  schedule:
    - cron: "0 10 3 * *"   # 10:00 UTC on the 3rd of each month
  workflow_dispatch: {}

concurrency:
  group: macro-trade-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch FRED US trade balance
        env:
          FED_API_KEY: ${{ secrets.FED_API_KEY }}
        run: python pipeline/fetch_macro_trade.py

      - name: Fetch World Bank country data
        run: python pipeline/fetch_worldbank.py
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/macro_trade.json data/worldbank_countries.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Macro trade + World Bank refresh $(date -u +%Y-%m-%d)"
            # Safe push: integrate remote first (our generated data wins on
            # conflict), with allow-unrelated for any divergence. Prevents the
            # "! [rejected] main -> main (fetch first)" failure when this race-
            # commits against the nightly.
            for i in 1 2 3 4 5; do
              if git push origin HEAD:main; then echo "pushed (attempt $i)"; break; fi
              echo "push $i rejected — integrating remote (ours wins on data/)"
              git fetch origin main || true
              git merge -X ours --allow-unrelated-histories --no-edit origin/main 2>/dev/null || true
              git checkout --ours -- data/macro_trade.json data/worldbank_countries.json 2>/dev/null || true
              git add data/macro_trade.json data/worldbank_countries.json 2>/dev/null || true
              git commit --no-edit 2>/dev/null || true
              sleep 4
            done
          fi
