name: Macro Trade + World Bank Refresh

# US trade balance (FRED) prints monthly with a ~45-day lag; World Bank GDP is
# annual but cheap to re-pull. Running on the 3rd of each month catches the
# monthly trade print and keeps the World Bank file current.
#
# FIXED: this workflow previously called pipeline/fetch_macro_trade.py, which
# does NOT exist — the trade-balance fetcher lives in pipeline/fetch_macro.py
# (it writes data/macro_trade.json). Calling the missing script failed every
# run. It now calls fetch_macro.py and passes BOTH FRED key names so it works
# whether the repo secret is named FED_API_KEY or FRED_API_KEY.

on:
  schedule:
    - cron: "0 10 3 * *"   # 10:00 UTC on the 3rd of each month
  workflow_dispatch: {}

concurrency:
  group: macro-trade-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install requirements
        run: pip install requests pandas fredapi

      - name: Fetch FRED US trade balance (writes data/macro_trade.json)
        env:
          FED_API_KEY: ${{ secrets.FED_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python pipeline/fetch_macro.py

      - name: Fetch World Bank country data
        run: python pipeline/fetch_worldbank.py
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only add files that exist (worldbank step may have been skipped).
          git add data/macro_trade.json 2>/dev/null || true
          [ -f data/worldbank_countries.json ] && git add data/worldbank_countries.json || true
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Macro trade + World Bank refresh $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              if git push; then echo "Pushed on attempt $i"; break; fi
              git pull --rebase --autostash origin main || git pull --rebase --autostash origin master || true
              sleep 4
            done
          fi
